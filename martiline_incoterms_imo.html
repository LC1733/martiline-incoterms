<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incoterms® 2020 — Martiline</title>
<style>
:root{--orange:#F26522;--bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--card:#1e2235;--border:#2e3350;--text:#e8eaf0;--muted:#7a82a0;--green:#2ecc71;--blue:#3498db;--red:#e74c3c;--yellow:#f1c40f;}
.light{--bg:#f4f5f9;--bg2:#eaecf4;--bg3:#dde0ef;--card:#fff;--border:#c8cce0;--text:#1a1d27;--muted:#5a6080;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;}
header{background:var(--bg2);border-bottom:2px solid var(--orange);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-text{font-size:15px;font-weight:700;}
.logo-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.hdr-right{display:flex;align-items:center;gap:8px;}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;}
.btn:hover{background:var(--orange);color:#fff;border-color:var(--orange);}
.btn-lang{min-width:48px;text-align:center;}
.btn-lang.active{background:var(--orange);color:#fff;border-color:var(--orange);}
.tab-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;overflow-x:auto;}
.tab{padding:11px 18px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.main{padding:20px 24px;max-width:1400px;margin:0 auto;}
.panel{display:none;}.panel.active{display:block;}
.search-row{display:flex;gap:10px;margin-bottom:20px;align-items:center;flex-wrap:wrap;}
.search-input{flex:1;min-width:200px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--orange);}
.filter-btn{padding:9px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s;}
.filter-btn.active,.filter-btn:hover{background:var(--orange);color:#fff;border-color:var(--orange);}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:24px;}
.inc-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:border-color .2s,transform .15s,box-shadow .2s;position:relative;overflow:hidden;}
.inc-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent,var(--orange));}
.inc-card:hover{border-color:var(--orange);transform:translateY(-3px);box-shadow:0 8px 24px rgba(242,101,34,.15);}
.inc-card.sel{border-color:var(--orange);background:rgba(242,101,34,.07);}
.inc-code{font-size:28px;font-weight:900;font-family:monospace;line-height:1;}
.inc-en{font-size:12px;font-weight:600;color:var(--text);margin:5px 0 2px;}
.inc-es{font-size:11px;color:var(--muted);}
.inc-mode-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;margin-top:8px;}
.tag-any{background:rgba(52,152,219,.15);color:var(--blue);}
.tag-sea{background:rgba(46,204,113,.15);color:var(--green);}
.detail{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px;display:none;animation:fadeIn .2s ease;}
.detail.show{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.detail-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:16px;}
.close-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;flex-shrink:0;}
.close-btn:hover{color:var(--red);border-color:var(--red);}
.detail-body{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:700px){.detail-body{grid-template-columns:1fr;}}
.section-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;margin-bottom:10px;}
.vblock{background:var(--bg3);border-radius:8px;padding:12px;margin-top:10px;}
.vb-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.vb-v{color:var(--orange);}.vb-c{color:var(--blue);}
.vb-text{font-size:11px;color:var(--text);line-height:1.6;}
.mat-wrap{overflow-x:auto;}
.mat{width:100%;border-collapse:collapse;font-size:11px;}
.mat th{padding:7px 10px;background:var(--bg3);border:1px solid var(--border);font-size:10px;text-align:center;font-weight:700;}
.mat th:first-child{text-align:left;}
.mat td{padding:7px 10px;border:1px solid var(--border);text-align:center;}
.mat td:first-child{text-align:left;font-weight:500;}
.v{color:var(--green);font-weight:700;}.c{color:var(--blue);font-weight:700;}
.risk-indicator{display:flex;align-items:center;gap:6px;margin-top:12px;}
.risk-track{flex:1;height:6px;background:var(--bg3);border-radius:3px;}
.risk-fill{height:6px;border-radius:3px;}
.timeline{position:relative;padding:16px 0;margin:12px 0;}
.tl-track{position:absolute;top:24px;left:0;right:0;height:3px;background:var(--bg3);}
.tl-fill{height:3px;background:linear-gradient(90deg,var(--orange),var(--blue));position:absolute;top:0;left:0;}
.tl-points{display:flex;justify-content:space-between;position:relative;z-index:1;}
.tl-point{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.tl-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:var(--bg);}
.tl-dot.active{background:var(--orange);border-color:var(--orange);box-shadow:0 0 8px rgba(242,101,34,.4);}
.tl-dot.past{background:var(--green);border-color:var(--green);}
.tl-label{font-size:9px;color:var(--muted);text-align:center;max-width:60px;}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.badge-any{background:rgba(52,152,219,.15);color:var(--blue);}
.badge-sea{background:rgba(46,204,113,.15);color:var(--green);}
.comp-wrap{overflow-x:auto;}
.comp{border-collapse:collapse;font-size:11px;min-width:920px;width:100%;}
.comp th{padding:8px 10px;background:var(--bg3);border:1px solid var(--border);text-align:center;font-size:10px;font-weight:700;}
.comp th:first-child{text-align:left;min-width:160px;}
.comp td{padding:7px 10px;border:1px solid var(--border);text-align:center;}
.comp td:first-child{text-align:left;font-weight:500;background:var(--card);}
.comp tr:nth-child(even) td:not(:first-child){background:rgba(242,101,34,.03);}
.hdr-hl{background:rgba(242,101,34,.2)!important;color:var(--orange)!important;}
.sel-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:600px;}
.sel-opt{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--text);font-size:13px;cursor:pointer;text-align:left;width:100%;margin-bottom:10px;transition:border-color .2s;}
.sel-opt:hover{border-color:var(--orange);}

/* ══════════ MÓDULO IMO / IMDG ══════════ */
.imo-console{background:radial-gradient(120% 140% at 88% -15%,rgba(242,101,34,.34) 0%,rgba(242,101,34,0) 58%),linear-gradient(160deg,#12141c 0%,#1b1f2b 100%);
  border:1px solid #2e3350;border-radius:14px;padding:26px 26px 22px;color:#e8eaf0;position:relative;overflow:hidden;margin-bottom:20px;}
.imo-console::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(75% 70% at 18% 0%,#000 0%,transparent 78%);mask-image:radial-gradient(75% 70% at 18% 0%,#000 0%,transparent 78%);pointer-events:none;}
.imo-eyebrow{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#FF8A3D;font-weight:800;margin-bottom:7px;position:relative;z-index:2;}
.imo-h{font-size:21px;font-weight:900;letter-spacing:-.3px;line-height:1.2;margin-bottom:6px;position:relative;z-index:2;}
.imo-p{font-size:12px;color:rgba(232,234,240,.6);max-width:660px;line-height:1.6;position:relative;z-index:2;}

.imo-search{position:relative;display:flex;gap:10px;margin:20px 0 4px;z-index:2;flex-wrap:wrap;}
.imo-field{position:relative;flex:1;min-width:220px;}
.imo-field input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#fff;
  font:600 13px/1 'Segoe UI',system-ui,sans-serif;padding:13px 13px 13px 40px;outline:none;transition:border-color .25s,background .25s,box-shadow .25s;}
.imo-field input::placeholder{color:rgba(232,234,240,.35);font-weight:500;}
.imo-field input:focus{border-color:var(--orange);background:rgba(255,255,255,.1);box-shadow:0 0 0 3px rgba(242,101,34,.18);}
.imo-mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;}
.imo-field.scanning::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:38%;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--orange),transparent);animation:imoScan .9s linear infinite;}
@keyframes imoScan{0%{transform:translateX(-15%)}100%{transform:translateX(275%)}}
.imo-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#e8eaf0;border-radius:8px;padding:0 16px;
  font:700 12px 'Segoe UI',sans-serif;cursor:pointer;transition:background .2s,transform .18s,border-color .2s;}
.imo-btn:hover{background:var(--orange);border-color:var(--orange);color:#fff;transform:translateY(-2px);}

.imo-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0 2px;position:relative;z-index:2;}
.imo-stat{border-left:2px solid var(--orange);padding-left:12px;}
.imo-stat b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;}
.imo-stat span{font-size:9px;text-transform:uppercase;letter-spacing:1.3px;color:rgba(232,234,240,.5);}

.imo-classes{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;position:relative;z-index:2;}
.imo-dia{width:74px;background:none;border:0;color:inherit;cursor:pointer;text-align:center;padding:0;opacity:.75;transition:opacity .25s,transform .25s;}
.imo-dia:hover{opacity:1;transform:translateY(-3px);}
.imo-dia .dia{width:38px;height:38px;margin:5px auto 8px;border-radius:5px;border:2px solid rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;transform:rotate(45deg);
  transition:box-shadow .3s,border-color .3s;animation:imoFloat 6s ease-in-out infinite;}
.imo-dia:nth-child(2n) .dia{animation-delay:-1.5s}.imo-dia:nth-child(3n) .dia{animation-delay:-3s}.imo-dia:nth-child(4n) .dia{animation-delay:-4.5s}
@keyframes imoFloat{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(45deg) translateY(-4px)}}
.imo-dia .dia i{transform:rotate(-45deg);font-style:normal;font-weight:900;font-size:14px;}
.imo-dia.on{opacity:1;}
.imo-dia.on .dia{border-color:#fff;box-shadow:0 0 0 4px rgba(242,101,34,.35),0 10px 20px -10px rgba(0,0,0,.9);}
.imo-dia b{display:block;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;}
.imo-dia small{display:block;font-size:8.5px;line-height:1.25;color:rgba(232,234,240,.55);}

.imo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap;}
.imo-count{font-size:12px;color:var(--muted);}
.imo-count b{color:var(--orange);font-size:15px;font-variant-numeric:tabular-nums;}
.imo-chips{display:flex;gap:6px;flex-wrap:wrap;}
.imo-chip{font-size:11px;font-weight:600;padding:7px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .2s;}
.imo-chip:hover{border-color:var(--orange);color:var(--orange);}
.imo-chip.on{background:var(--orange);border-color:var(--orange);color:#fff;}

.imo-list{display:grid;gap:9px;}
.imo-item{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--orange);border-radius:10px;
  padding:12px 16px;cursor:pointer;transition:box-shadow .25s,transform .2s,border-color .25s;animation:imoIn .45s cubic-bezier(.22,1,.36,1) both;}
@keyframes imoIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.imo-item:hover{transform:translateX(3px);border-color:var(--orange);box-shadow:0 8px 22px rgba(242,101,34,.12);}
.imo-top{display:flex;align-items:center;gap:14px;}
.imo-un{font-family:monospace;font-size:19px;font-weight:900;letter-spacing:-.5px;min-width:76px;}
.imo-un span{font-size:8.5px;display:block;color:var(--muted);letter-spacing:1.6px;font-weight:700;}
.imo-name{flex:1;font-size:12.5px;font-weight:600;line-height:1.45;}
.imo-tags{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.imo-tag{font-size:10px;font-weight:800;padding:4px 9px;border-radius:6px;white-space:nowrap;}
.imo-tag.sec{background:var(--bg3);color:var(--muted);}
.imo-tag.lq{background:rgba(46,204,113,.15);color:var(--green);}
.imo-tag.lq0{background:rgba(231,76,60,.15);color:var(--red);}
.imo-det{max-height:0;overflow:hidden;transition:max-height .4s ease,margin .4s ease;}
.imo-item.open .imo-det{max-height:360px;margin-top:12px;}
.imo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;border-top:1px dashed var(--border);padding-top:12px;}
.imo-cell{background:var(--bg3);border-radius:8px;padding:9px 11px;}
.imo-cell u{display:block;text-decoration:none;font-size:9px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin-bottom:3px;}
.imo-cell p{font-size:11.5px;font-weight:700;font-family:monospace;word-break:break-word;}
.imo-dgd{display:flex;align-items:center;gap:10px;margin-top:10px;background:#12141c;border:1px solid #2e3350;border-radius:8px;padding:10px 12px;}
.imo-dgd code{flex:1;color:#FF8A3D;font-size:11.5px;font-weight:700;letter-spacing:.3px;}
.imo-copy{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:6px;padding:6px 12px;font:800 10px 'Segoe UI',sans-serif;cursor:pointer;transition:.2s;white-space:nowrap;}
.imo-copy:hover{background:var(--orange);}
.imo-empty{text-align:center;padding:34px;color:var(--muted);font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;}
.imo-more{display:block;width:100%;margin-top:10px;background:var(--card);border:1px dashed var(--border);color:var(--muted);
  padding:12px;border-radius:10px;font:700 11px 'Segoe UI',sans-serif;cursor:pointer;transition:.2s;letter-spacing:.5px;}
.imo-more:hover{border-color:var(--orange);color:var(--orange);}

.imo-dist{margin-top:22px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 22px;}
.imo-dist h4{font-size:12px;font-weight:800;margin-bottom:2px;}
.imo-dist p{font-size:11px;color:var(--muted);margin-bottom:16px;}
.imo-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.imo-row .lbl{width:150px;font-size:10.5px;font-weight:600;color:var(--muted);flex-shrink:0;}
.imo-track{flex:1;height:9px;background:var(--bg3);border-radius:5px;overflow:hidden;}
.imo-fill{height:100%;width:0;border-radius:5px;transition:width 1.1s cubic-bezier(.22,1,.36,1);}
.imo-row .val{width:42px;text-align:right;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;}

.imo-ticker{margin-top:18px;background:#12141c;border:1px solid #2e3350;border-radius:10px;overflow:hidden;position:relative;padding:10px 0;}
.imo-ticker::before,.imo-ticker::after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none;}
.imo-ticker::before{left:0;background:linear-gradient(90deg,#12141c,transparent);}
.imo-ticker::after{right:0;background:linear-gradient(270deg,#12141c,transparent);}
.imo-run{display:flex;gap:34px;width:max-content;animation:imoRun 48s linear infinite;}
.imo-ticker:hover .imo-run{animation-play-state:paused;}
@keyframes imoRun{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.imo-tk{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(232,234,240,.55);white-space:nowrap;}
.imo-tk b{color:#FF8A3D;font-family:monospace;font-weight:800;}
.imo-tk i{width:7px;height:7px;transform:rotate(45deg);border-radius:1px;display:inline-block;flex-shrink:0;}

.imo-note{margin-top:16px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--muted);border-radius:8px;padding:14px 18px;font-size:11px;color:var(--muted);line-height:1.65;}
.imo-note strong{color:var(--text);}

@media(max-width:700px){
  .imo-console{padding:20px 16px;}
  .imo-stats{grid-template-columns:1fr;gap:10px;}
  .imo-top{flex-wrap:wrap;gap:8px;}
  .imo-tags{justify-content:flex-start;}
  .imo-row .lbl{width:92px;}
}
@media(prefers-reduced-motion:reduce){
  .imo-dia .dia,.imo-run,.imo-field.scanning::after,.imo-item{animation:none!important;}
  .imo-fill{transition:none;}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div style="background:var(--orange);border-radius:8px;padding:8px 14px;font-weight:900;color:#fff;font-size:15px;letter-spacing:1px;flex-shrink:0;">MARTILINE</div>
    <div>
      <div class="logo-text" id="hdr-title">Incoterms® 2020</div>
      <div class="logo-sub" id="hdr-sub">Freight Forwarding · Santiago · Lima</div>
    </div>
  </div>
  <div class="hdr-right">
    <button class="btn btn-lang active" id="btn-es" onclick="setLang('es')">ES</button>
    <button class="btn btn-lang" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="btn" onclick="toggleTheme()" id="theme-btn">☀ Modo Claro</button>
  </div>
</header>

<div class="tab-bar" id="tab-bar">
  <div class="tab active" onclick="switchTab('explorer')" id="tab-explorer">🔍 Explorer</div>
  <div class="tab" onclick="switchTab('matrix')" id="tab-matrix">📊 Matriz Completa</div>
  <div class="tab" onclick="switchTab('selector')" id="tab-selector">⚖ Selector</div>
  <div class="tab" onclick="switchTab('imo')" id="tab-imo">☣ Códigos IMO</div>
</div>

<div class="main">
  <div id="panel-explorer" class="panel active">
    <div class="search-row">
      <input class="search-input" type="text" id="search-input" placeholder="🔍  Buscar..." oninput="filterCards(this.value)">
      <button class="filter-btn active" id="fb-all" onclick="setFilter('all',this)">Todos (11)</button>
      <button class="filter-btn" id="fb-any" onclick="setFilter('any',this)">🌐 Multimodal (7)</button>
      <button class="filter-btn" id="fb-sea" onclick="setFilter('sea',this)">⚓ Marítimo (4)</button>
    </div>
    <div id="detail-box" class="detail"></div>
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <div id="panel-matrix" class="panel">
    <div style="margin-bottom:16px;font-size:13px;color:var(--muted)">
      <span style="color:var(--green);font-weight:700">● S = Seller/Vendedor</span> &nbsp;|&nbsp; <span style="color:var(--blue);font-weight:700">● B = Buyer/Comprador</span>
    </div>
    <div class="comp-wrap"><table class="comp" id="comp-table"></table></div>
    <div style="margin-top:12px;font-size:11px;color:var(--muted)" id="matrix-note"></div>
  </div>

  <div id="panel-selector" class="panel">
    <div style="margin-bottom:16px;font-size:13px;color:var(--muted)" id="sel-intro"></div>
    <div id="selector-ui"></div>
    <div id="selector-result" style="display:none"></div>
  </div>

  <div id="panel-imo" class="panel">
    <div class="imo-console">
      <div class="imo-eyebrow" id="imo-eyebrow"></div>
      <div class="imo-h" id="imo-title"></div>
      <div class="imo-p" id="imo-lead"></div>

      <div class="imo-search">
        <div class="imo-field" id="imo-field">
          <span class="imo-mag">🔍</span>
          <input id="imo-q" type="search" autocomplete="off" aria-label="Buscar mercancía peligrosa">
        </div>
        <button class="imo-btn" id="imo-reset" type="button"></button>
      </div>

      <div class="imo-stats">
        <div class="imo-stat"><b id="imo-s1">0</b><span id="imo-s1l"></span></div>

// ===== STATE =====
let isDark=true, modeFilter='all', searchQ='', openCode=null, selPath=[];

// ===== THEME =====
function toggleTheme(){
  isDark=!isDark;
  document.body.classList.toggle('light',!isDark);
  document.getElementById('theme-btn').textContent=isDark?T[lang].themeLight:T[lang].themeDark;
}

// ===== LANG =====
function setLang(l){
  lang=l;
  document.getElementById('btn-es').classList.toggle('active',l==='es');
  document.getElementById('btn-en').classList.toggle('active',l==='en');
  applyLang();
  renderCards();
  buildComp();
  selPath=[];
  renderSelector();
  if(openCode){showDetail(openCode);}
}

function applyLang(){
  const t=T[lang];
  document.getElementById('hdr-title').textContent=t.hdrTitle;
  document.getElementById('hdr-sub').textContent=t.hdrSub;
  document.getElementById('theme-btn').textContent=isDark?t.themeLight:t.themeDark;
  document.getElementById('tab-explorer').textContent=t.tabExplorer;
  document.getElementById('tab-matrix').textContent=t.tabMatrix;
  document.getElementById('tab-selector').textContent=t.tabSelector;
  document.getElementById('search-input').placeholder=t.searchPlaceholder;
  document.getElementById('fb-all').textContent=t.fbAll;
  document.getElementById('fb-any').textContent=t.fbAny;
  document.getElementById('fb-sea').textContent=t.fbSea;
  document.getElementById('matrix-note').textContent=t.matrixNote;
  document.getElementById('sel-intro').textContent=t.selIntro;
  document.getElementById('footer-text').textContent=t.footer;
}

// ===== TABS =====
const tabIds=['explorer','matrix','selector'];
function switchTab(id){
  tabIds.forEach(t=>{document.getElementById('panel-'+t).classList.toggle('active',t===id);});
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',tabIds[i]===id));
}

// ===== FILTER =====
function setFilter(f,btn){modeFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderCards();}
function filterCards(q){searchQ=q;renderCards();}
function getFiltered(){
  return inco.filter(d=>{
    const mOk=modeFilter==='all'||modeFilter===d.mode;
    const lq=searchQ.toLowerCase();
    const sOk=!lq||d.code.toLowerCase().includes(lq)||d.en.toLowerCase().includes(lq)||d.es.toLowerCase().includes(lq)||d.desc.en.toLowerCase().includes(lq)||d.desc.es.toLowerCase().includes(lq);
    return mOk&&sOk;
  });
}

// ===== CARDS =====
function renderCards(){
  const t=T[lang];
  const grid=document.getElementById('cards-grid');
  const filtered=getFiltered();
  if(!filtered.length){grid.innerHTML=`<div style="text-align:center;color:var(--muted);padding:40px;font-size:13px;">No results.</div>`;return;}
  grid.innerHTML=filtered.map(d=>`
    <div class="inc-card" onclick="showDetail('${d.code}')" id="card-${d.code}" style="--accent:${d.accent}">
      <div class="inc-code" style="color:${d.accent}">${d.code}</div>
      <div class="inc-en">${d.en}</div>
      <div class="inc-es">${d.es}</div>
      <div class="inc-mode-tag ${d.mode==='any'?'tag-any':'tag-sea'}">${d.mode==='any'?t.modeAny:t.modeSea}</div>
      <div class="risk-indicator">
        <div style="font-size:9px;color:var(--muted);width:60px">${t.riskV}</div>
        <div class="risk-track"><div class="risk-fill" style="width:${d.risk_v}%;background:${d.accent}"></div></div>
        <div style="font-size:9px;color:${d.accent};font-weight:700;width:28px;text-align:right">${d.risk_v}%</div>
      </div>
    </div>`).join('');
}

// ===== DETAIL =====
function showDetail(code){
  const d=inco.find(x=>x.code===code);
  if(!d)return;
  if(openCode===code){closeDetail();return;}
  openCode=code;
  const t=T[lang];
  document.querySelectorAll('.inc-card').forEach(c=>c.classList.toggle('sel',c.id==='card-'+code));
  const box=document.getElementById('detail-box');
  const tlHtml=`<div class="timeline"><div class="tl-track"><div class="tl-fill" style="width:${(d.tl/5)*100}%"></div></div>
    <div class="tl-points">${t.tlLabels.map((l,i)=>`<div class="tl-point"><div class="tl-dot ${i<d.tl?'past':i===d.tl?'active':''}"></div><div class="tl-label" style="color:${i===d.tl?d.accent:'var(--muted)'}">${l}</div></div>`).join('')}</div></div>`;
  const matHtml=`<table class="mat"><tr><th>${t.colStage}</th><th>${t.colCosts}</th><th>${t.colRisks}</th></tr>${d.costs.map(r=>`<tr><td>${r[0]}</td><td class="${r[1]==='V'?'v':'c'}">${r[1]==='V'?t.seller:t.buyer}</td><td class="${r[2]==='V'?'v':'c'}">${r[2]==='V'?t.seller:t.buyer}</td></tr>`).join('')}</table>`;
  box.innerHTML=`
    <div class="detail-hdr">
      <div>
        <div style="font-size:40px;font-weight:900;font-family:monospace;color:${d.accent}">${d.code}</div>
        <div style="font-size:16px;font-weight:700;margin:4px 0">${d.en}</div>
        <div style="font-size:13px;color:var(--muted)">${d.es}</div>
        <div style="margin-top:8px"><span class="badge ${d.mode==='any'?'badge-any':'badge-sea'}">${d.mode==='any'?t.badgeAny:t.badgeSea}</span></div>
      </div>
      <button class="close-btn" onclick="closeDetail()">${t.closeBtn}</button>
    </div>
    <div style="font-size:12px;line-height:1.7;color:var(--muted);padding:12px;background:var(--bg3);border-radius:8px;border-left:3px solid ${d.accent};margin-bottom:16px">${d.desc[lang]}</div>
    <div style="margin-bottom:12px">
      <div class="section-title">${t.transferLabel}</div>
      <div style="font-size:12px;font-weight:600;color:${d.accent}">📍 ${d.transfer[lang]}</div>
      ${tlHtml}
    </div>
    <div class="detail-body">
      <div>
        <div class="vblock"><div class="vb-title vb-v">${t.vendedor}</div><div class="vb-text">${d.vendedor[lang]}</div></div>
        <div class="vblock"><div class="vb-title vb-c">${t.comprador}</div><div class="vb-text">${d.comprador[lang]}</div></div>
      </div>
      <div><div class="section-title">${t.colCosts} / ${t.colRisks}</div><div class="mat-wrap">${matHtml}</div></div>
    </div>`;
  box.classList.add('show');
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

function closeDetail(){document.getElementById('detail-box').classList.remove('show');document.querySelectorAll('.inc-card').forEach(c=>c.classList.remove('sel'));openCode=null;}

// ===== SELECTOR =====
function renderSelector(){
  const t=T[lang];
  const ui=document.getElementById('selector-ui');
  document.getElementById('selector-result').style.display='none';
  const step=selPath.length;
  const qs=questions[lang];
  const q=step===0?qs[0]:qs[selPath[step-1]?.next];
  if(!q)return;
  ui.innerHTML=`<div class="sel-card">
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px">${t.selStep} ${step+1}</div>
    <div style="font-size:15px;font-weight:600;margin-bottom:16px">${q.q}</div>
    ${q.opts.map((o,i)=>`<button class="sel-opt" onclick="selStep(${i})">${o.t}</button>`).join('')}
    ${step>0?`<button onclick="selBack()" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;margin-top:6px">${t.selPrev}</button>`:''}
  </div>`;
}

function selStep(i){
  const step=selPath.length;
  const qs=questions[lang];
  const q=step===0?qs[0]:qs[selPath[step-1]?.next];
  const opt=q.opts[i];
  selPath.push(opt);
  if(opt.r)showSelResult(opt.r);else renderSelector();
}
function selBack(){selPath.pop();renderSelector();}
function showSelResult(code){
  const d=inco.find(x=>x.code===code);
  const t=T[lang];
  document.getElementById('selector-ui').innerHTML='';
  const res=document.getElementById('selector-result');
  res.style.display='block';
  res.innerHTML=`<div class="sel-card" style="border:2px solid ${d.accent}">
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px">${t.selRecommended}</div>
    <div style="font-size:36px;font-weight:900;font-family:monospace;color:${d.accent}">${d.code}</div>
    <div style="font-size:15px;font-weight:700;margin:4px 0">${d.en}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">${d.es}</div>
    <div style="font-size:12px;line-height:1.7;padding:12px;background:var(--bg3);border-radius:8px;margin-bottom:16px">${d.desc[lang]}</div>
    <div style="display:flex;gap:10px">
      <button onclick="showDetail('${code}');switchTab('explorer')" style="background:${d.accent};border:none;color:#fff;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600">${t.selDetail}</button>
      <button onclick="selPath=[];renderSelector();document.getElementById('selector-result').style.display='none'" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;cursor:pointer;font-size:12px">${t.selRestart}</button>
    </div>
  </div>`;
}

// ===== INIT =====
applyLang();
renderCards();
buildComp();
renderSelector();
</script>

<script>
// ===== MÓDULO IMO / IMDG =====
(function(){
"use strict";
var D = window.__IMO__ || [];
if(typeof tabIds!=="undefined" && tabIds.indexOf("imo")<0) tabIds.push("imo");

var CL = {
  "1":{bg:"#F1A32D",fg:"#12141c",es:"Explosivos",en:"Explosives"},
  "2":{bg:"#009639",fg:"#ffffff",es:"Gases",en:"Gases"},
  "3":{bg:"#E2231A",fg:"#ffffff",es:"Líq. inflamables",en:"Flammable liquids"},
  "4":{bg:"repeating-linear-gradient(90deg,#E2231A 0 4px,#fff 4px 8px)",fg:"#12141c",es:"Sól. inflamables",en:"Flammable solids"},
  "5":{bg:"#FFD100",fg:"#12141c",es:"Comburentes",en:"Oxidizers"},
  "6":{bg:"#ffffff",fg:"#12141c",es:"Tóxicas",en:"Toxic substances"},
  "7":{bg:"linear-gradient(#F5C400 50%,#fff 50%)",fg:"#12141c",es:"Radiactivos",en:"Radioactive"},
  "8":{bg:"linear-gradient(#ffffff 50%,#12141c 50%)",fg:"#E2231A",es:"Corrosivos",en:"Corrosives"},
  "9":{bg:"repeating-linear-gradient(90deg,#12141c 0 3px,#fff 3px 6px)",fg:"#12141c",es:"Varios",en:"Miscellaneous"}
};

var L = {
 es:{tab:"☣ Códigos IMO", eyebrow:"Consola de consulta IMDG",
   title:"Verifique el número ONU antes de reservar",
   lead:"Busque por número ONU o por nombre de la sustancia y filtre por clase tocando los rombos de peligro. Cada resultado muestra clase, riesgo secundario, grupo de embalaje, cantidad limitada, instrucción de embalaje y cisterna portátil.",
   ph:"Ej.: 1830, ácido sulfúrico, nitrato, batería…", reset:"Limpiar filtros",
   s1:"Números ONU en lista", s2:"Clases y divisiones", s3:"% admite cantidad limitada",
   lq:"Admite cantidad limitada", results:"resultados", showing:"mostrando", none:"Sin resultados",
   empty:"No hay coincidencias. Pruebe con el número ONU (ej.: 1830) o con parte del nombre (ej.: ácido).",
   more:"Ver más resultados", distT:"Distribución de la lista por clase",
   distS:"Cantidad de números ONU registrados en cada clase de peligro.",
   cEmb:"Instrucción de embalaje", cCist:"Cisterna portátil", cDisp:"Disposiciones especiales", cLq:"Cantidad limitada",
   copy:"Copiar línea DG", copied:"Copiado", riskSec:"Riesgo sec.", cls:"Clase", pg:"GE", noLq:"Sin LQ",
   note:"<strong>Alcance y responsabilidad.</strong> Herramienta interna de referencia rápida elaborada a partir de la Lista de Mercancías Peligrosas del Código IMDG (OMI). No sustituye a la edición oficial vigente ni a sus enmiendas, que prevalecen ante cualquier discrepancia. Conforme al capítulo 5.4 del Código IMDG, la <strong>clasificación, el nombre de expedición apropiado, el embalaje, el marcado, el etiquetado y la Declaración de Mercancías Peligrosas son responsabilidad del expedidor</strong>; Martiline actúa como agente de carga y traslada al transportista la información declarada por el cliente, sin asumir la verificación técnica de la clasificación. Verifique además EmS, segregación, condición de contaminante del mar, punto de inflamación y las restricciones de cada naviera, terminal y autoridad portuaria antes de confirmar el booking."},
 en:{tab:"☣ IMO Codes", eyebrow:"IMDG lookup console",
   title:"Check the UN number before booking",
   lead:"Search by UN number or substance name and filter by class using the hazard diamonds. Each result shows class, subsidiary risk, packing group, limited quantity, packing instruction and portable tank instruction. Substance names are reproduced from the Spanish edition of the IMDG list.",
   ph:"E.g.: 1830, sulfúrico, nitrato, batería…", reset:"Clear filters",
   s1:"UN numbers listed", s2:"Classes and divisions", s3:"% allowing limited quantity",
   lq:"Limited quantity allowed", results:"results", showing:"showing", none:"No results",
   empty:"No matches. Try the UN number (e.g. 1830) or part of the Spanish name (e.g. ácido).",
   more:"Show more results", distT:"List breakdown by class",
   distS:"Number of UN entries recorded in each hazard class.",
   cEmb:"Packing instruction", cCist:"Portable tank", cDisp:"Special provisions", cLq:"Limited quantity",
   copy:"Copy DG line", copied:"Copied", riskSec:"Subs. risk", cls:"Class", pg:"PG", noLq:"No LQ",
   note:"<strong>Scope and liability.</strong> Internal quick-reference tool built from the Dangerous Goods List of the IMDG Code (IMO). It does not replace the official edition in force or its amendments, which prevail in case of discrepancy. Under chapter 5.4 of the IMDG Code, <strong>classification, proper shipping name, packing, marking, labelling and the Dangerous Goods Declaration are the shipper's responsibility</strong>; Martiline acts as freight forwarder and passes the information declared by the customer to the carrier, without assuming technical verification of the classification. Always check EmS, segregation, marine pollutant status, flashpoint and the restrictions of each carrier, terminal and port authority before confirming the booking."}
};

var TICK = ["0331","1942","1830","2031","1789","1824","1263","1170","1993","3082","2794","1090","1791","2067","1760","3077","1950","2924"];
var PAGE = 40;
var norm = function(s){return (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();};
var $ = function(id){return document.getElementById(id);};
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
var isGrad = function(v){return v.indexOf("gradient")>=0;};

D.forEach(function(x){ x._k = x.u + " " + norm(x.n); });

var st = {q:"", cls:null, pg:null, lq:false, shown:0};
var current = [];
var counts = {}, divisions = {};
Object.keys(CL).forEach(function(k){counts[k]=0;});
D.forEach(function(x){
  (x.c||[]).forEach(function(c){divisions[c]=1;});
  var root=(x.c[0]||"").split(".")[0];
  if(counts[root]!==undefined) counts[root]++;
});
var lqOk = D.filter(function(x){return x.l && norm(x.l).indexOf("NINGUNA")<0;}).length;
var maxC = Math.max.apply(null, Object.keys(counts).map(function(k){return counts[k];}));

function tx(){ return L[typeof lang!=="undefined" && L[lang] ? lang : "es"]; }

/* ---- render estático dependiente de idioma ---- */
function paintStatic(){
  var t = tx();
  $("tab-imo").textContent = t.tab;
  $("imo-eyebrow").textContent = t.eyebrow;
  $("imo-title").textContent = t.title;
  $("imo-lead").textContent = t.lead;
  $("imo-q").placeholder = t.ph;
  $("imo-reset").textContent = t.reset;
  $("imo-s1l").textContent = t.s1; $("imo-s2l").textContent = t.s2; $("imo-s3l").textContent = t.s3;
  $("imo-chip-lq").textContent = t.lq;
  $("imo-more").textContent = t.more;
  $("imo-dist-t").textContent = t.distT;
  $("imo-dist-s").textContent = t.distS;
  $("imo-note").innerHTML = t.note;

  $("imo-classes").innerHTML = Object.keys(CL).map(function(k){
    var on = st.cls===k ? " on" : "";
    return '<button class="imo-dia'+on+'" type="button" data-cls="'+k+'" aria-pressed="'+(!!on)+'">'+
      '<div class="dia" style="background:'+CL[k].bg+'"><i style="color:'+CL[k].fg+'">'+k+'</i></div>'+
      '<b>'+counts[k]+'</b><small>'+CL[k][lang==="en"?"en":"es"]+'</small></button>';
  }).join("");

  $("imo-dist-rows").innerHTML = Object.keys(CL).map(function(k){
    return '<div class="imo-row"><div class="lbl">'+t.cls+' '+k+' · '+CL[k][lang==="en"?"en":"es"]+'</div>'+
      '<div class="imo-track"><div class="imo-fill" data-w="'+(counts[k]/maxC*100)+'" style="background:'+CL[k].bg+'"></div></div>'+
      '<div class="val">'+counts[k]+'</div></div>';
  }).join("");
  if(distDone) fillBars();

  var tk = TICK.map(function(u){
    var it = D.filter(function(x){return x.u===u;})[0];
    if(!it) return "";
    var root=(it.c[0]||"9").split(".")[0];
    var nm = it.n.length>44 ? it.n.slice(0,44)+"…" : it.n;
    return '<div class="imo-tk"><i style="background:'+CL[root].bg+'"></i><b>UN '+it.u+'</b> '+nm+'</div>';
  }).join("");
  $("imo-ticker").innerHTML = tk + tk;
}

/* ---- resultados ---- */
function cell(t,v){ return '<div class="imo-cell"><u>'+t+'</u><p>'+(v && v.trim() ? v : "—")+'</p></div>'; }

function card(x,i){
  var t = tx();
  var root = (x.c[0]||"9").split(".")[0];
  var m = CL[root]||CL["9"];
  var cls = x.c.join(" / ") || "—";
  var lqOkX = x.l && norm(x.l).indexOf("NINGUNA")<0;
  var dgd = "UN "+x.u+", "+x.n+", "+cls+(x.g.length?", "+x.g.join("/"):"")+(x.r.length?", ("+t.riskSec+" "+x.r.join("/")+")":"");
  return '<div class="imo-item" style="border-left-color:'+(isGrad(m.bg)?"var(--orange)":m.bg)+';animation-delay:'+Math.min(i*20,380)+'ms">'+
    '<div class="imo-top">'+
      '<div class="imo-un">'+x.u+'<span>UN</span></div>'+
      '<div class="imo-name">'+x.n+'</div>'+
      '<div class="imo-tags">'+
        '<span class="imo-tag" style="background:'+(isGrad(m.bg)?"#12141c":m.bg)+';color:'+(isGrad(m.bg)?"#fff":m.fg)+'">'+t.cls+' '+cls+'</span>'+
        (x.r.length?'<span class="imo-tag sec">'+t.riskSec+' '+x.r.join("/")+'</span>':'')+
        (x.g.length?'<span class="imo-tag sec">'+t.pg+' '+x.g.join("/")+'</span>':'')+
        '<span class="imo-tag '+(lqOkX?"lq":"lq0")+'">'+(lqOkX?"LQ "+x.l:t.noLq)+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="imo-det"><div class="imo-grid">'+
      cell(t.cEmb,x.e)+cell(t.cCist,x.t)+cell(t.cDisp,x.d.join(", "))+cell(t.cLq,x.l)+
    '</div>'+
    '<div class="imo-dgd"><code>'+dgd+'</code><button class="imo-copy" type="button" data-dgd="'+dgd.replace(/"/g,"&quot;")+'">'+t.copy+'</button></div>'+
    '</div></div>';
}

function match(){
  var q = norm(st.q).trim();
  return D.filter(function(x){
    if(q && x._k.indexOf(q)<0) return false;
    if(st.cls && (x.c[0]||"").split(".")[0]!==st.cls) return false;
    if(st.pg && (x.g||[]).indexOf(st.pg)<0) return false;
    if(st.lq && (!x.l || norm(x.l).indexOf("NINGUNA")>=0)) return false;
    return true;
  });
}

function render(reset){
  var t = tx();
  if(reset){ current = match(); st.shown = 0; $("imo-list").innerHTML = ""; }
  var slice = current.slice(st.shown, st.shown+PAGE);
  $("imo-list").insertAdjacentHTML("beforeend", slice.map(card).join(""));
  st.shown += slice.length;
  $("imo-count").innerHTML = current.length
    ? '<b>'+current.length.toLocaleString(lang==="en"?"en-US":"es-CL")+'</b> '+t.results+' · '+t.showing+' '+st.shown
    : t.none;
  if(!current.length) $("imo-list").innerHTML = '<div class="imo-empty">'+t.empty+'</div>';
  $("imo-more").style.display = st.shown < current.length ? "block" : "none";
}

/* ---- animaciones ---- */
function countUp(el,target,suffix){
  if(reduce || !window.requestAnimationFrame){ el.textContent = target.toLocaleString("es-CL")+(suffix||""); return; }
  var t0=null, dur=1200;
  requestAnimationFrame(function step(ts){
    if(!t0) t0=ts;
    var p=Math.min((ts-t0)/dur,1), e=1-Math.pow(1-p,3);
    el.textContent = Math.round(target*e).toLocaleString("es-CL")+(suffix||"");
    if(p<1) requestAnimationFrame(step);
  });
}
var statsDone=false, distDone=false;
function fillBars(){
  var f = document.querySelectorAll("#imo-dist .imo-fill");
  for(var i=0;i<f.length;i++){
    (function(el,i){ setTimeout(function(){ el.style.width = el.dataset.w+"%"; }, reduce?0:i*70); })(f[i],i);
  }
}
function reveal(){
  if(!statsDone){
    statsDone = true;
    countUp($("imo-s1"), D.length);
    countUp($("imo-s2"), Object.keys(divisions).length);
    countUp($("imo-s3"), Math.round(lqOk/D.length*100), "%");
  }
  if(!distDone){ distDone = true; fillBars(); }
}

/* ---- eventos ---- */
var timer;
$("imo-q").addEventListener("input", function(e){
  st.q = e.target.value;
  $("imo-field").classList.add("scanning");
  clearTimeout(timer);
  timer = setTimeout(function(){ $("imo-field").classList.remove("scanning"); render(true); }, 160);
});
$("imo-classes").addEventListener("click", function(e){
  var b = e.target.closest(".imo-dia"); if(!b) return;
  var k = b.dataset.cls;
  st.cls = st.cls===k ? null : k;
  var all = this.querySelectorAll(".imo-dia");
  for(var i=0;i<all.length;i++){
    var on = all[i].dataset.cls===st.cls;
    all[i].classList.toggle("on", on); all[i].setAttribute("aria-pressed", on);
  }
  render(true);
});
$("imo-chips").addEventListener("click", function(e){
  var b = e.target.closest(".imo-chip"); if(!b) return;
  if(b.dataset.pg){ st.pg = st.pg===b.dataset.pg ? null : b.dataset.pg; } else { st.lq = !st.lq; }
  var all = this.querySelectorAll(".imo-chip");
  for(var i=0;i<all.length;i++){
    all[i].classList.toggle("on", (all[i].dataset.pg && all[i].dataset.pg===st.pg) || (all[i].dataset.lq && st.lq));
  }
  render(true);
});
$("imo-list").addEventListener("click", function(e){
  var cp = e.target.closest(".imo-copy");
  if(cp){
    e.stopPropagation();
    if(navigator.clipboard) navigator.clipboard.writeText(cp.dataset.dgd);
    var old = cp.textContent; cp.textContent = tx().copied;
    setTimeout(function(){ cp.textContent = old; }, 1400);
    return;
  }
  var it = e.target.closest(".imo-item");
  if(it) it.classList.toggle("open");
});
$("imo-more").addEventListener("click", function(){ render(false); });
$("imo-reset").addEventListener("click", function(){
  st = {q:"", cls:null, pg:null, lq:false, shown:0};
  $("imo-q").value = "";
  var d = document.querySelectorAll(".imo-dia"), c = document.querySelectorAll(".imo-chip");
  for(var i=0;i<d.length;i++){ d[i].classList.remove("on"); d[i].setAttribute("aria-pressed","false"); }
  for(var j=0;j<c.length;j++){ c[j].classList.remove("on"); }
  render(true);
});

/* ---- integración con el idioma y el pie ---- */
window.imoApplyLang = function(){
  paintStatic();
  render(true);
  var f = document.getElementById("footer-text");
  var extra = lang==="en"
    ? " · Dangerous goods list: IMDG Code © IMO — reference transcription; the official edition in force prevails."
    : " · Lista de mercancías peligrosas: Código IMDG © OMI — transcripción de referencia; prevalece la edición oficial vigente.";
  f.textContent = T[lang].footer.replace(/©\s*\d{4}/, "© " + new Date().getFullYear()) + extra;
};

var _apply = applyLang;
applyLang = function(){ _apply(); window.imoApplyLang(); };

/* ---- arranque ---- */
paintStatic();
render(true);
window.imoApplyLang();

if(window.IntersectionObserver){
  var io = new IntersectionObserver(function(en){
    for(var i=0;i<en.length;i++){ if(en[i].isIntersecting){ reveal(); io.disconnect(); break; } }
  },{threshold:.15});
  io.observe(document.querySelector(".imo-console"));
  var _switch = switchTab;
  switchTab = function(id){ _switch(id); if(id==="imo") setTimeout(reveal, 120); };
} else { reveal(); }
})();
</script>
</body>
</html>
