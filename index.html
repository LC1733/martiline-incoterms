<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incoterms® 2020 — Enfoque Freight Forwarder | Martiline</title>
<style>
:root{--orange:#F26522;--bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--card:#1e2235;--border:#2e3350;
  --text:#e8eaf0;--muted:#7a82a0;--green:#2ecc71;--blue:#3498db;--red:#e74c3c;--yellow:#f1c40f;}
.light{--bg:#f4f5f9;--bg2:#eaecf4;--bg3:#dde0ef;--card:#fff;--border:#c8cce0;--text:#1a1d27;--muted:#5a6080;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  transition:background .3s,color .3s;}
header{background:var(--bg2);border-bottom:2px solid var(--orange);padding:12px 24px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:200;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-mark{background:var(--orange);border-radius:8px;padding:8px 14px;font-weight:900;color:#fff;
  font-size:15px;letter-spacing:1px;flex-shrink:0;}
.logo-text{font-size:15px;font-weight:700;}
.logo-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.hdr-right{display:flex;align-items:center;gap:8px;}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;
  cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;}
.btn:hover{background:var(--orange);color:#fff;border-color:var(--orange);}
.btn-lang{min-width:48px;text-align:center;}
.btn-lang.active{background:var(--orange);color:#fff;border-color:var(--orange);}
.btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
.tab-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;overflow-x:auto;}
.tab{padding:11px 18px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.main{padding:20px 24px;max-width:1400px;margin:0 auto;}
.panel{display:none;}
.panel.active{display:block;}
.search-row{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.search-input{flex:1;min-width:220px;padding:10px 14px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--orange);}
footer{text-align:center;padding:16px 24px;border-top:1px solid var(--border);margin-top:10px;}
footer span{font-size:9px;color:var(--muted);letter-spacing:.3px;line-height:1.8;}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-mark">MARTILINE</div>
    <div>
      <div class="logo-text">Incoterms® 2020</div>
      <div class="logo-sub" id="hdr-sub">Enfoque Freight Forwarder · Santiago · Lima</div>
    </div>
  </div>
  <div class="hdr-right">
    <button class="btn btn-lang active" id="btn-es" type="button" onclick="setLang('es')">ES</button>
    <button class="btn btn-lang" id="btn-en" type="button" onclick="setLang('en')">EN</button>
    <button class="btn" id="theme-btn" type="button" onclick="toggleTheme()">☀ Modo Claro</button>
  </div>
</header>

<div class="tab-bar" id="tab-bar"></div>
<div class="main"></div>

<footer><span id="footer-text"></span></footer>

<script>
var lang = "es", isDark = true, tabIds = [];
var T = {
  es:{sub:"Enfoque Freight Forwarder · Santiago · Lima", themeLight:"☀ Modo Claro", themeDark:"🌙 Modo Oscuro",
      footer:"Contenido normativo Incoterms® © ICC — Cámara de Comercio Internacional 2020 · Herramienta interna Martiline SpA"},
  en:{sub:"Freight Forwarder view · Santiago · Lima", themeLight:"☀ Light Mode", themeDark:"🌙 Dark Mode",
      footer:"Normative content Incoterms® © ICC — International Chamber of Commerce 2020 · Martiline SpA internal tool"}
};
var ACC = {EXW:"#e74c3c",FCA:"#e67e22",CPT:"#f1c40f",CIP:"#2ecc71",DAP:"#3498db",DPU:"#9b59b6",
           DDP:"#1abc9c",FAS:"#16a085",FOB:"#2980b9",CFR:"#8e44ad",CIF:"#c0392b"};
var inco = Object.keys(ACC).map(function(k){return {code:k, accent:ACC[k], transfer:{es:"",en:""}};});

function toggleTheme(){
  isDark = !isDark;
  document.body.classList.toggle("light", !isDark);
  document.getElementById("theme-btn").textContent = isDark ? T[lang].themeLight : T[lang].themeDark;
}
function switchTab(id){
  for(var i=0;i<tabIds.length;i++){
    var p = document.getElementById("panel-"+tabIds[i]);
    if(p) p.classList.toggle("active", tabIds[i]===id);
  }
  var tb = document.querySelectorAll(".tab");
  for(var j=0;j<tb.length;j++) tb[j].classList.toggle("active", tabIds[j]===id);
}
function applyLang(){
  document.getElementById("btn-es").classList.toggle("active", lang==="es");
  document.getElementById("btn-en").classList.toggle("active", lang==="en");
  document.getElementById("hdr-sub").textContent = T[lang].sub;
  document.getElementById("theme-btn").textContent = isDark ? T[lang].themeLight : T[lang].themeDark;
  document.getElementById("footer-text").innerHTML =
    "© " + new Date().getFullYear() + " Luis Cartes Henríquez · Creación original protegida — Convenio de Berna / OMPI · " +
    "Prohibida su reproducción, adaptación o uso en entrenamiento de IA sin autorización expresa.<br>" + T[lang].footer;
}
function setLang(l){ lang = l; applyLang(); }
applyLang();
</script>
<style>
/* ══════════ MÓDULO FREIGHT FORWARDER ══════════ */
.ff-hero{background:linear-gradient(150deg,var(--card) 0%,var(--bg3) 100%);border:1px solid var(--border);
  border-left:4px solid var(--orange);border-radius:12px;padding:24px 26px;margin-bottom:18px;}
.ff-eyebrow{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--orange);font-weight:800;margin-bottom:8px;}
.ff-hero h2{font-size:23px;font-weight:900;letter-spacing:-.6px;line-height:1.15;margin-bottom:8px;}
.ff-hero h2 em{font-style:normal;color:var(--orange);}
.ff-hero p{font-size:12.5px;color:var(--muted);max-width:78ch;line-height:1.7;}

.ff-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.ff-chip{font-size:11px;font-weight:600;padding:8px 13px;border-radius:8px;background:var(--card);
  border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .2s;}
.ff-chip:hover{border-color:var(--orange);color:var(--orange);}
.ff-chip.on{background:var(--orange);border-color:var(--orange);color:#fff;}

.ff-card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--orange);
  border-radius:12px;margin-bottom:14px;overflow:hidden;transition:box-shadow .25s,border-color .25s;}
.ff-card:hover{box-shadow:0 8px 26px rgba(242,101,34,.10);}
.ff-head{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;padding:18px 20px 12px;}
.ff-code{font-family:monospace;font-size:30px;font-weight:900;letter-spacing:-1.5px;line-height:1;min-width:78px;}
.ff-names{flex:1;min-width:220px;}
.ff-names h3{font-size:14px;font-weight:700;}
.ff-names span{font-size:11.5px;color:var(--muted);}
.ff-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;}
.ff-tag{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:4px 9px;
  border-radius:6px;white-space:nowrap;border:1px solid var(--border);color:var(--muted);}
.ff-tag.any{background:rgba(52,152,219,.14);color:var(--blue);border-color:rgba(52,152,219,.35);}
.ff-tag.sea{background:rgba(46,204,113,.14);color:var(--green);border-color:rgba(46,204,113,.35);}
.ff-tag.nom{background:rgba(242,101,34,.13);color:var(--orange);border-color:rgba(242,101,34,.4);}

.ff-points{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;padding:0 20px 14px;}
.ff-pt{background:var(--bg3);border-radius:9px;padding:13px 15px;}
.ff-pt u{display:block;text-decoration:none;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  font-weight:800;color:var(--muted);margin-bottom:6px;}
.ff-pt.risk u{color:var(--red);}
.ff-pt.cost u{color:var(--yellow);}
.ff-pt p{font-size:12px;line-height:1.65;}

.ff-railbox{padding:2px 20px 18px;}
.ff-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-bottom:10px;}
.ff-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.ff-rail{overflow-x:auto;padding-bottom:4px;}
.ff-rail table{border-collapse:collapse;width:100%;min-width:880px;}
.ff-rail th{font-size:8.5px;font-weight:600;color:var(--muted);text-align:center;padding:0 2px 8px;
  vertical-align:bottom;line-height:1.3;border:0;width:8.33%;}
.ff-rail td{padding:0;height:12px;border:0;position:relative;}
.ff-seg{height:6px;border-radius:3px;background:var(--bg3);}
.ff-seg.s{background:var(--green);}
.ff-seg.b{background:var(--blue);}
.ff-lbl{font-size:8.5px;color:var(--muted);text-align:left;padding-top:6px;font-weight:800;
  letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap;}
.ff-pin{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;
  border:3px solid var(--bg);background:var(--orange);box-shadow:0 0 0 3px rgba(242,101,34,.25);z-index:2;}
.ff-pin.alt{background:var(--yellow);box-shadow:0 0 0 3px rgba(241,196,15,.2);}
.ff-pin::after{content:attr(data-t);position:absolute;top:-23px;left:50%;transform:translateX(-50%);
  font-size:8px;font-weight:800;letter-spacing:.6px;color:var(--orange);background:var(--card);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;white-space:nowrap;}
.ff-pin.alt::after{color:var(--yellow);}

.ff-toggle{width:100%;background:var(--bg3);border:0;border-top:1px solid var(--border);color:var(--orange);
  font:800 12.5px 'Segoe UI',sans-serif;padding:13px 20px;cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;gap:10px;text-align:left;transition:background .2s;}
.ff-toggle:hover{background:var(--card);}
.ff-toggle span.arw{font-size:10px;color:var(--muted);transition:transform .25s;}
.ff-card.open .ff-toggle span.arw{transform:rotate(90deg);}
.ff-body{display:none;background:var(--bg3);padding:2px 20px 20px;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;}
.ff-card.open .ff-body{display:grid;}
.ff-blk{border-left:2px solid var(--border);padding-left:13px;}
.ff-blk h5{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:800;margin-bottom:6px;
  display:flex;gap:8px;align-items:baseline;}
.ff-blk h5 i{font-style:normal;color:var(--orange);font-weight:900;}
.ff-blk p,.ff-blk li{font-size:11.5px;color:var(--muted);line-height:1.6;}
.ff-blk ul{list-style:none;}
.ff-blk li{position:relative;padding-left:13px;margin-bottom:3px;}
.ff-blk li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:1px;background:var(--orange);}
.ff-blk.alert{border-left-color:var(--red);}
.ff-blk.alert h5 i{color:var(--red);}
.ff-blk.alert li::before{background:var(--red);}

.ff-sec{margin-top:26px;}
.ff-sec h3{font-size:16px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px;}
.ff-sec .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;max-width:78ch;}
.ff-matwrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--card);}
table.ff-mat{border-collapse:collapse;width:100%;min-width:900px;font-size:11.5px;}
table.ff-mat th{background:var(--bg3);text-align:left;padding:10px 13px;font-size:9.5px;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted);font-weight:800;border-bottom:1px solid var(--border);}
table.ff-mat td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--muted);}
table.ff-mat tr:last-child td{border-bottom:0;}
table.ff-mat td.k{font-family:monospace;font-weight:900;font-size:14px;color:var(--text);}
.ff-who{font-weight:800;font-size:10px;letter-spacing:.4px;}
.ff-who.v{color:var(--green);}
.ff-who.c{color:var(--blue);}

.ff-imo{background:linear-gradient(150deg,#12141c 0%,#1b1420 60%,#241206 100%);border:1px solid #3a2410;
  border-radius:12px;padding:24px 26px;color:#e8eaf0;position:relative;overflow:hidden;}
.ff-imo::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(242,101,34,.05) 0 1px,transparent 1px 34px);}
.ff-imo h3{font-size:17px;font-weight:900;margin-bottom:6px;position:relative;}
.ff-imo h3 b{color:var(--orange);}
.ff-imo>p{font-size:12.5px;color:rgba(232,234,240,.62);max-width:78ch;line-height:1.7;position:relative;}
.ff-imogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px;position:relative;}
.ff-imocard{background:rgba(255,255,255,.04);border:1px solid rgba(242,101,34,.22);border-radius:9px;padding:13px 15px;}
.ff-imocard h4{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--orange);font-weight:800;margin-bottom:7px;}
.ff-imocard ul{list-style:none;}
.ff-imocard li{font-size:11.5px;color:rgba(232,234,240,.62);padding-left:12px;position:relative;margin-bottom:4px;line-height:1.55;}
.ff-imocard li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:1px;background:var(--orange);}

.ff-note{margin-top:16px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--muted);
  border-radius:8px;padding:14px 18px;font-size:11px;color:var(--muted);line-height:1.65;}
.ff-note strong{color:var(--text);}
.ff-xfer{display:flex;align-items:flex-start;gap:6px;margin-top:10px;font-size:9.5px;line-height:1.45;color:var(--muted);}
.ff-xfer b{color:var(--orange);font-size:9px;letter-spacing:.8px;text-transform:uppercase;display:block;margin-bottom:2px;}
@media(max-width:700px){
  .ff-code{font-size:24px;min-width:60px;}
  .ff-points,.ff-body{grid-template-columns:1fr;}
}
@media(prefers-reduced-motion:reduce){.ff-toggle span.arw{transition:none;}}
</style>

 '<div class="ff-sec"><h3 id="ff-matT"></h3><p class="sub" id="ff-matS"></p>'+
   '<div class="ff-matwrap"><table class="ff-mat"><thead id="ff-matHead"></thead><tbody id="ff-matBody"></tbody></table></div></div>'+
 '<div class="ff-sec"><div class="ff-imo">'+
   '<h3 id="ff-imoT"></h3><p id="ff-imoP"></p><div class="ff-imogrid" id="ff-imoGrid"></div>'+
 '</div><div class="ff-note" id="ff-note"></div></div>';
document.querySelector(".main").appendChild(panel);
if(typeof tabIds!=="undefined" && tabIds.indexOf("ff")<0) tabIds.push("ff");

/* ── estado ── */
var stF = {q:"", f:"all"};

/* ── raíl doble riesgo/costo ── */
function rail(d){
  var t = T2(), head="", r="", c="";
  for(var i=0;i<STAGES.length;i++){
    head += '<th>'+STAGES[i]+'</th>';
    r += '<td><div class="ff-seg '+(i<=d.riskIdx?"s":"b")+'"></div>'+
         (i===d.riskIdx?'<span class="ff-pin" data-t="'+t.rRisk.toUpperCase()+'"></span>':'')+
         (d.altIdx===i?'<span class="ff-pin alt" data-t="ALT."></span>':'')+'</td>';
    c += '<td><div class="ff-seg '+(i<=d.costIdx?"s":"b")+'"></div>'+
         (i===d.costIdx?'<span class="ff-pin" data-t="'+t.rCost.toUpperCase()+'"></span>':'')+'</td>';
  }
  return '<div class="ff-railbox"><div class="ff-legend">'+
    '<span><i style="background:var(--green)"></i>'+t.seller+'</span>'+
    '<span><i style="background:var(--blue)"></i>'+t.buyer+'</span>'+
    '<span><i style="background:var(--orange)"></i>'+t.pin+'</span>'+
    (d.altIdx!==undefined?'<span><i style="background:var(--yellow)"></i>'+t.alt+'</span>':'')+
    '</div><div class="ff-rail"><table><thead><tr>'+head+'</tr></thead><tbody>'+
    '<tr>'+r+'</tr><tr><td colspan="12" class="ff-lbl">'+t.rRisk+'</td></tr>'+
    '<tr>'+c+'</tr><tr><td colspan="12" class="ff-lbl">'+t.rCost+'</td></tr>'+
    '</tbody></table></div></div>';
}

function li(a){ var s=""; for(var i=0;i<a.length;i++) s+='<li>'+a[i]+'</li>'; return s; }

function card(d){
  var t = T2(), f = d.ff;
  var accent = (typeof inco!=="undefined" && inco.filter(function(x){return x.code===d.code;})[0]) ?
               inco.filter(function(x){return x.code===d.code;})[0].accent : "var(--orange)";
  return '<div class="ff-card" data-code="'+d.code+'" data-fam="'+d.fam+'" data-nom="'+d.nom+'" style="border-left-color:'+accent+'">'+
   '<div class="ff-head">'+
     '<div class="ff-code" style="color:'+accent+'">'+d.code+'</div>'+
     '<div class="ff-names"><h3>'+d.es+'</h3><span>'+d.en+'</span></div>'+
     '<div class="ff-tags">'+
       '<span class="ff-tag '+(d.fam==="sea"?"sea":"any")+'">'+(d.fam==="sea"?t.sea:t.any)+'</span>'+
       '<span class="ff-tag nom">'+(d.nom==="c"?t.nomc:t.nomv)+'</span>'+
     '</div>'+
   '</div>'+
   '<div class="ff-points">'+
     '<div class="ff-pt risk"><u>'+t.risk+'</u><p>'+d.risk+'</p></div>'+
     '<div class="ff-pt cost"><u>'+t.cost+'</u><p>'+d.cost+'</p></div>'+
   '</div>'+
   rail(d)+
   '<button class="ff-toggle" type="button"><span>'+t.toggle+'</span><span class="arw">▶</span></button>'+
   '<div class="ff-body">'+
     '<div class="ff-blk"><h5><i>1</i>'+t.b1+'</h5><p>'+f.nom+'</p></div>'+
     '<div class="ff-blk"><h5><i>2</i>'+t.b2+'</h5><p>'+f.main+'</p></div>'+
     '<div class="ff-blk"><h5><i>3</i>'+t.b3+'</h5><ul>'+li(f.quote)+'</ul></div>'+
     '<div class="ff-blk"><h5><i>4</i>'+t.b4+'</h5><ul>'+li(f.orig)+'</ul></div>'+
     '<div class="ff-blk"><h5><i>5</i>'+t.b5+'</h5><ul>'+li(f.dest)+'</ul></div>'+
     '<div class="ff-blk"><h5><i>6</i>'+t.b6+'</h5><ul>'+li(f.docs)+'</ul></div>'+
     '<div class="ff-blk"><h5><i>7</i>'+t.b7+'</h5><p>'+f.scope+'</p></div>'+
     '<div class="ff-blk"><h5><i>8</i>'+t.b8+'</h5><ul>'+li(f.costs)+'</ul></div>'+
     '<div class="ff-blk alert"><h5><i>9</i>'+t.b9+'</h5><ul>'+li(f.alert)+'</ul></div>'+
   '</div></div>';
}

function strip(s){ return (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }

function renderFF(){
  var q = strip(stF.q).trim();
  var out = DATA.filter(function(d){
    if(stF.f==="any"||stF.f==="sea"){ if(d.fam!==(stF.f==="any"?"multi":"sea")) return false; }
    if(stF.f==="nom-c" && d.nom!=="c") return false;
    if(stF.f==="nom-v" && d.nom!=="v") return false;
    if(q){
      var hay = strip(d.code+" "+d.es+" "+d.en+" "+d.risk+" "+d.cost+" "+d.mrisk+" "+d.scope+" "+JSON.stringify(d.ff));
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  document.getElementById("ff-list").innerHTML = out.length ? out.map(card).join("")
    : '<div class="imo-empty" style="text-align:center;padding:34px;color:var(--muted);font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:10px">—</div>';
}

function paintFF(){
  var t = T2();
  document.getElementById("tab-ff").textContent = t.tab;
  document.getElementById("ff-eyebrow").textContent = t.eyebrow;
  document.getElementById("ff-h2").innerHTML = t.h2a+'<em>'+t.h2b+'</em>';
  document.getElementById("ff-lead").textContent = t.lead;
  document.getElementById("ff-langnote").innerHTML = t.langnote;
  document.getElementById("ff-q").placeholder = "🔍  "+(lang==="en"
    ? "Search: unloading, customs, insurance, demurrage…"
    : "Buscar: descarga, aduana, seguro, sobrestadía…");
  var fl = [["all",t.all],["any",t.any],["sea",t.sea],["nom-c",t.nomc],["nom-v",t.nomv]];
  document.getElementById("ff-filters").innerHTML = fl.map(function(x){
    return '<button class="ff-chip'+(stF.f===x[0]?" on":"")+'" type="button" data-f="'+x[0]+'">'+x[1]+'</button>';
  }).join("");
  document.getElementById("ff-matT").textContent = t.matT;
  document.getElementById("ff-matS").textContent = t.matS;
  document.getElementById("ff-matHead").innerHTML =
    '<tr><th>'+t.cRule+'</th><th>'+t.cNom+'</th><th>'+t.cMain+'</th><th>'+t.cRisk+'</th><th>'+t.cScope+'</th></tr>';
  document.getElementById("ff-matBody").innerHTML = DATA.map(function(d){
    var w = d.nom==="c" ? "c" : "v";
    var who = d.nom==="c" ? (lang==="en"?"BUYER":"COMPRADOR") : (lang==="en"?"SELLER":"VENDEDOR");
    var who2 = d.nom==="c" ? (lang==="en"?"Buyer":"Comprador") : (lang==="en"?"Seller":"Vendedor");
    return '<tr><td class="k">'+d.code+'</td><td><span class="ff-who '+w+'">'+who+'</span></td>'+
      '<td><span class="ff-who '+w+'">'+who2+'</span></td><td>'+d.mrisk+'</td><td>'+d.scope+'</td></tr>';
  }).join("");
  document.getElementById("ff-imoT").innerHTML = t.imoT1+'<b>'+t.imoT2+'</b>'+t.imoT3;
  document.getElementById("ff-imoP").textContent = t.imoP;
  document.getElementById("ff-imoGrid").innerHTML =
    [[t.i1,t.i1l],[t.i2,t.i2l],[t.i3,t.i3l],[t.i4,t.i4l]].map(function(b){
      return '<div class="ff-imocard"><h4>'+b[0]+'</h4><ul>'+li(b[1])+'</ul></div>';
    }).join("");
  document.getElementById("ff-note").innerHTML = t.note;
  renderFF();
}

/* ── eventos ── */
document.getElementById("ff-q").addEventListener("input", function(e){ stF.q = e.target.value; renderFF(); });
document.getElementById("ff-filters").addEventListener("click", function(e){
  var b = e.target.closest(".ff-chip"); if(!b) return;
  stF.f = b.dataset.f;
  var all = this.querySelectorAll(".ff-chip");
  for(var i=0;i<all.length;i++) all[i].classList.toggle("on", all[i].dataset.f===stF.f);
  renderFF();
});
document.getElementById("ff-list").addEventListener("click", function(e){
  var b = e.target.closest(".ff-toggle"); if(!b) return;
  b.parentNode.classList.toggle("open");
});

/* ── punto exacto en lugar del porcentaje, en el Explorer ── */
DATA.forEach(function(d){
  var it = (typeof inco!=="undefined") ? inco.filter(function(x){return x.code===d.code;})[0] : null;
  if(it){ it.xfer = d.mrisk; it.transfer.es = d.mrisk; }
});
if(typeof renderCards==="function"){
  renderCards = function(){
    var t = T[lang], grid = document.getElementById("cards-grid"), fl = getFiltered();
    if(!fl.length){ grid.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px;font-size:13px;">No results.</div>'; return; }
    grid.innerHTML = fl.map(function(d){
      return '<div class="inc-card" onclick="showDetail(\''+d.code+'\')" id="card-'+d.code+'" style="--accent:'+d.accent+'">'+
        '<div class="inc-code" style="color:'+d.accent+'">'+d.code+'</div>'+
        '<div class="inc-en">'+d.en+'</div><div class="inc-es">'+d.es+'</div>'+
        '<div class="inc-mode-tag '+(d.mode==="any"?"tag-any":"tag-sea")+'">'+(d.mode==="any"?t.modeAny:t.modeSea)+'</div>'+
        '<div class="ff-xfer"><div><b>'+T2().xfer+'</b>'+(d.transfer[lang]||d.transfer.es)+'</div></div>'+
      '</div>';
    }).join("");
  };
  renderCards();
}

/* ── enganche con el cambio de idioma ── */
var _prev = applyLang;
applyLang = function(){ _prev(); paintFF(); };
paintFF();
})();
</script>

<script>switchTab('ff');
if(document.querySelectorAll('.tab').length<2) document.getElementById('tab-bar').style.display='none';</script>
</body>
